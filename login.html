<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editor Sign In | Metro Gazette</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="editor-auth-page"><main class="editor-auth-shell"><a class="editor-brand" href="/"><img src="metro-gazette-social.png" alt="Metro Gazette — News That Matters"></a><section class="editor-auth-card"><p class="editor-kicker">EDITOR ACCESS</p><h1>Sign in to Metro Gazette</h1><p class="editor-help">Use your editor account to access the newsroom dashboard.</p><form id="loginForm" novalidate><label for="loginEmail">Email address</label><input id="loginEmail" type="email" autocomplete="email" required><label for="loginPassword">Password</label><div class="password-field"><input id="loginPassword" type="password" autocomplete="current-password" required><button id="togglePassword" type="button">Show</button></div><p id="loginError" class="form-message form-message--error" role="alert" hidden></p><button id="loginSubmit" class="editor-primary-button" type="submit">Sign In</button></form><a class="editor-back-link" href="/">← Return to Metro Gazette</a></section></main><script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getAuth, browserLocalPersistence, onAuthStateChanged, setPersistence, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
const config={apiKey:'AIzaSyAg6igpcCyd9sqQsAoO4dxGGnNDMt5ZQ7c',authDomain:'metro-gazette.firebaseapp.com',projectId:'metro-gazette',storageBucket:'metro-gazette.firebasestorage.app',messagingSenderId:'330532123264',appId:'1:330532123264:web:bf8ca274522bf481936c65'};const auth=getAuth(initializeApp(config));const form=document.querySelector('#loginForm'),error=document.querySelector('#loginError'),submit=document.querySelector('#loginSubmit'),password=document.querySelector('#loginPassword'),toggle=document.querySelector('#togglePassword');await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,user=>{if(user&&!user.isAnonymous)window.location.replace('dashboard.html')});toggle.onclick=()=>{const visible=password.type==='text';password.type=visible?'password':'text';toggle.textContent=visible?'Show':'Hide'};form.onsubmit=async event=>{event.preventDefault();error.hidden=true;submit.disabled=true;submit.textContent='Signing in…';try{await signInWithEmailAndPassword(auth,document.querySelector('#loginEmail').value.trim(),password.value);window.location.replace('dashboard.html')}catch(e){error.textContent='The email address or password is incorrect. Please try again.';error.hidden=false}finally{submit.disabled=false;submit.textContent='Sign In'}};
</script></body></html>
