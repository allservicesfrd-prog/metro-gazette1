<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Metro Gazette</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-page{max-width:760px;margin:0 auto;padding:72px 20px}.dashboard-card{padding:36px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;box-shadow:0 12px 30px rgba(15,23,42,.08)}.dashboard-card h1{margin:0 0 12px;color:#0f172a;font-size:clamp(32px,5vw,48px)}.dashboard-card p{color:#475569;line-height:1.6}.dashboard-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.dashboard-actions a{padding:11px 16px;border-radius:6px;background:#dc2626;color:#fff;font:700 13px Inter,system-ui,sans-serif}.dashboard-actions a:last-child{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
  </style>
</head>
<body>
  <header class="masthead"><div class="masthead-inner"><a href="/" class="logo-link" aria-label="Metro Gazette Home"><div class="masthead-name">METRO <span class="accent">GAZETTE</span></div></a></div></header>
  <main class="dashboard-page"><section class="dashboard-card"><p class="eyebrow">Editor tools</p><h1>Metro Gazette Dashboard</h1><p>Sign in to write and manage articles, publish Business Spotlight placements, and access editorial controls.</p><div class="dashboard-actions"><a href="/?editor=login">Open editor</a><a href="/">Return home</a></div></section></main>
</body>
</html>
